<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .title { font-weight: 800; font-size: 42px; fill: url(#primary-grad); letter-spacing: -0.5px; }
    .subtitle { font-weight: 500; font-size: 19px; fill: #94a3b8; }
    .tagline { font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
    .node-text { font-weight: 600; font-size: 12px; fill: #e2e8f0; }
    .sub-node-text { font-weight: 400; font-size: 10px; fill: #94a3b8; }
    
    /* Animations */
    @keyframes pulseOrb {
      0% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
      100% { transform: scale(1); opacity: 0.25; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatBar {
      0% { height: 45px; y: 155px; }
      50% { height: 75px; y: 125px; }
      100% { height: 45px; y: 155px; }
    }
    @keyframes pulseRing {
      0% { r: 5px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }
    .pulsing-orb { transform-origin: center; animation: pulseOrb 7s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 6, 6; animation: dashStream 2s linear infinite; }
    .live-dot { animation: pulseRing 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="12"/>

  <!-- Ambient Dynamic Glowing Orbs in background -->
  <circle cx="150" cy="100" r="140" fill="url(#glow-grad)" class="pulsing-orb"/>
  <circle cx="1020" cy="280" r="160" fill="#6366f1" opacity="0.12" class="pulsing-orb" style="animation-delay: -3.5s;"/>

  <!-- Dynamic Dashboard Graphical Telemetry (Right Side Interactive Canvas) -->
  <g transform="translate(680, 50)" filter="url(#shadow)">
    <!-- Main Telemetry Window Frame -->
    <rect x="0" y="0" width="460" height="310" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="460" height="36" rx="10" fill="#131d31" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Window Controls -->
    <circle cx="22" cy="18" r="4.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="38" cy="18" r="4.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="54" cy="18" r="4.5" fill="#10b981" opacity="0.8"/>
    <text x="76" y="22" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">BI TELEMETRY &amp; METRIC CONTROL PLANE</text>
    <circle cx="430" cy="18" r="4" fill="#10b981"/>
    <circle cx="430" cy="18" r="4" fill="#10b981" class="live-dot"/>

    <!-- Dynamic Metrics Cards Inside Telemetry -->
    <g transform="translate(20, 52)">
      <!-- Card 1: Semantic Layer / Query -->
      <rect x="0" y="0" width="130" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="20" class="sub-node-text" fill="#94a3b8">SEMANTIC CACHE</text>
      <text x="12" y="42" font-size="18" font-weight="700" fill="#38bdf8">99.4%</text>
      <text x="76" y="42" font-size="10" font-weight="600" fill="#10b981">▲ +4.2%</text>
      <path d="M 12 53 L 40 49 L 75 52 L 118 47" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Card 2: Row-Level Security -->
      <rect x="145" y="0" width="130" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="157" y="20" class="sub-node-text" fill="#94a3b8">GOVERNED RLS</text>
      <text x="157" y="42" font-size="18" font-weight="700" fill="#a855f7">Active</text>
      <text x="215" y="42" font-size="10" font-weight="600" fill="#38bdf8">Zero Trust</text>
      <circle cx="260" cy="16" r="3" fill="#a855f7"/>

      <!-- Card 3: Ingestion Stream -->
      <rect x="290" y="0" width="130" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="302" y="20" class="sub-node-text" fill="#94a3b8">QUERY LATENCY</text>
      <text x="302" y="42" font-size="18" font-weight="700" fill="#34d399">14 ms</text>
      <text x="360" y="42" font-size="10" font-weight="600" fill="#10b981">Sub-sec</text>
      <circle cx="405" cy="16" r="3" fill="#34d399"/>
    </g>

    <!-- Animated Bar Chart Component -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="200" height="150" rx="6" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="600" fill="#cbd5e1">Aggregation Throughput</text>
      <line x1="12" y1="125" x2="188" y2="125" stroke="#334155" stroke-width="1"/>
      <line x1="12" y1="85" x2="188" y2="85" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="12" y1="45" x2="188" y2="45" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3"/>
      
      <!-- Bars with Animated Height -->
      <rect x="25" y="65" width="22" height="60" rx="3" fill="url(#accent-cyan)">
        <animate attributeName="height" values="60;85;45;60" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="65;40;80;65" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="65" y="45" width="22" height="80" rx="3" fill="url(#primary-grad)">
        <animate attributeName="height" values="80;50;95;80" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="45;75;30;45" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="105" y="35" width="22" height="90" rx="3" fill="url(#accent-purple)">
        <animate attributeName="height" values="90;105;70;90" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="35;20;55;35" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="145" y="55" width="22" height="70" rx="3" fill="url(#accent-cyan)">
        <animate attributeName="height" values="70;40;85;70" dur="4.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="55;85;40;55" dur="4.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Animated Data Pipeline Flow / Connected Nodes -->
    <g transform="translate(235, 130)">
      <rect x="0" y="0" width="205" height="150" rx="6" fill="#131d31" stroke="#1e293b" stroke-width="1"/>
      <text x="12" y="22" font-size="11" font-weight="600" fill="#cbd5e1">Governed Pipeline</text>
      
      <!-- Nodes -->
      <rect x="15" y="40" width="75" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="25" y="61" font-size="10" font-weight="600" fill="#e2e8f0">SQL Warehouse</text>

      <rect x="115" y="40" width="75" height="34" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="123" y="61" font-size="10" font-weight="600" fill="#e2e8f0">Metric Store</text>

      <rect x="65" y="98" width="80" height="34" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="73" y="119" font-size="10" font-weight="600" fill="#e2e8f0">Client Embeds</text>

      <!-- Flow Connectors with Stream Animation -->
      <path d="M 90 57 L 115 57" stroke="#38bdf8" stroke-width="2" fill="none" class="stream-line"/>
      <path d="M 152 74 L 152 86 L 125 98" stroke="#a855f7" stroke-width="2" fill="none" class="stream-line"/>
      <path d="M 52 74 L 52 86 L 85 98" stroke="#34d399" stroke-width="2" fill="none" class="stream-line"/>
    </g>
  </g>

  <!-- Foreground Content (Left Side Text & Feature Badges: strictly foreground, never hidden) -->
  <g transform="translate(60, 75)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="270" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#38bdf8"/>
      <text x="26" y="17" class="tagline">CURATED ENTERPRISE CATALOG</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" class="title">Enterprise BI &amp; Reporting</text>

    <!-- Subtitle & Detailed Scope -->
    <text x="0" y="105" class="subtitle">Custom Dashboards, Governed Semantic Layers &amp; Embedded Analytics</text>
    <text x="0" y="132" font-size="14" fill="#94a3b8">A comprehensive evaluation of leading SaaS platforms and production-ready open-source alternatives.</text>

    <!-- Feature Architecture Pills -->
    <g transform="translate(0, 168)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="34" rx="6" fill="#111c2e" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="14" y="21" class="node-text">📊 Self-Service BI</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="150" height="34" rx="6" fill="#111c2e" stroke="#818cf8" stroke-width="1.2"/>
        <text x="14" y="21" class="node-text">🔒 Governed RLS &amp; SSO</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(305, 0)">
        <rect x="0" y="0" width="145" height="34" rx="6" fill="#111c2e" stroke="#c084fc" stroke-width="1.2"/>
        <text x="14" y="21" class="node-text">⚡ Embedded SDKs</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(460, 0)">
        <rect x="0" y="0" width="115" height="34" rx="6" fill="#111c2e" stroke="#34d399" stroke-width="1.2"/>
        <text x="14" y="21" class="node-text">🗄️ SQL &amp; dbt</text>
      </g>
    </g>

    <!-- Sub-bar Indicator -->
    <g transform="translate(0, 226)">
      <text x="0" y="0" font-size="12" fill="#64748b" font-weight="500">✨ Covers Apache Superset, Metabase, Cube, Lightdash, Power BI, Tableau, Looker &amp; more</text>
    </g>
  </g>
</svg>